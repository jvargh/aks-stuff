apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-primary
  namespace: coredns-failover-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upstream-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upstream-primary
        app.kubernetes.io/part-of: coredns-failover-validation
    spec:
      containers:
        - name: coredns
          image: mcr.microsoft.com/oss/v2/kubernetes/coredns:v1.13.1-20
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: upstream-primary
---
