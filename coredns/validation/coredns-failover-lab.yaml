apiVersion: v1
kind: Namespace
metadata:
  name: coredns-failover-validation
  labels:
    app.kubernetes.io/part-of: coredns-failover-validation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-primary
  namespace: coredns-failover-validation
data:
  Corefile: |
    .:53 {
        errors
        log
        prometheus :9153
        template IN A answer.validation.test {
            answer "{{ .Name }} 30 IN A 192.0.2.10"
        }
        template IN A rcode.validation.test {
            rcode SERVFAIL
        }
        template IN NS . {
            rcode NOERROR
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-secondary
  namespace: coredns-failover-validation
data:
  Corefile: |
    .:53 {
        errors
        log
        prometheus :9153
        template IN A answer.validation.test {
            answer "{{ .Name }} 30 IN A 192.0.2.20"
        }
        template IN A rcode.validation.test {
            answer "{{ .Name }} 30 IN A 192.0.2.20"
        }
        template IN NS . {
            rcode NOERROR
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resolver-round-robin
  namespace: coredns-failover-validation
data:
  Corefile: |
    .:53 {
        errors
        log
        ready
        health
        prometheus :9153
        forward . 127.0.0.1 {
            policy round_robin
            max_fails 1
            health_check 500ms
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resolver-sequential
  namespace: coredns-failover-validation
data:
  Corefile: |
    .:53 {
        errors
        log
        ready
        health
        prometheus :9153
        forward . 127.0.0.1 {
            policy sequential
            max_fails 1
            health_check 500ms
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resolver-rcode-failover
  namespace: coredns-failover-validation
data:
  Corefile: |
    .:53 {
        errors
        log
        ready
        health
        prometheus :9153
        forward . 127.0.0.1 {
            policy sequential
            max_fails 1
            health_check 500ms
            failover SERVFAIL
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-primary
  namespace: coredns-failover-validation
spec:
  selector:
    app.kubernetes.io/name: upstream-primary
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: metrics
      port: 9153
      protocol: TCP
      targetPort: metrics
---
apiVersion: v1
